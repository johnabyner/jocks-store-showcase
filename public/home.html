<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icons Float</title>
    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/x-icon" href="public/img/html.png">   
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <nav class="section-bar">
        <div id="left-bar">
            <button><a href="">Lançamentos</a></button>
        </div>  

        <div id="middle-bar">
            <button><a href="">Jocks</a></button>
        </div>

        <div id="right-bar">
            <button><span class="material-symbols-outlined">search</span></button>
            <button><span class="material-symbols-outlined">shopping_cart_checkout</span></button>
            <button><span class="material-symbols-outlined">boy</span></button>
        </div>
    </nav>

    <main>
        <section id="home-section">
            <div class="home">
                <button class="homeLeftButton">&lt;</button>
                <img src="img/chrollo.gif" alt="imagem" class="homeImg">
                <button class="homeRightButton">&gt;</button>
            </div>
        </section>

        <section id="products-section">
            <div class="header-products">
                <h2>Best Sellers</h2>
                <p>os mais vendidos da jocks</p>
            </div>

            <div class="body-products">
                <div class="item">
                    <img src="img/kaneki.jpeg" alt="Tênis Cocks puff">
                    <p>Tênis Jocks Puff</p>
                </div>
                <div class="item imgOdd">
                    <img src="img/sasuke.jpeg" alt="Tênis Cocks flat core">
                    <p>Tênis Jocks Flat Core</p>
                </div>
                <div class="item">
                    <img src="img/guts.jpeg" alt="Tênis Cocks bold">
                    <p>Tênis Jocks <b>Bold</b></p>
                </div>
                <div class="item imgOdd">
                    <img src="img/shinji.jpeg" alt="Tênis Cocks Pop Lite<">
                    <p>Tênis Jocks Pop Lite</p>
                </div>
            </div>

        </section>

        <section>
            <div class="bot">
                <button><span class="material-symbols-outlined">smart_toy</span></button>
            </div>
        </section>

        <footer>&copy; 2026 Mogged</footer>

        <script type="module" src="main.js"></script>
    </main>
</body>
</html>
